<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournoi Mario Kart — AS Joliot-Curie</title>
<style>
  :root{
    --bg:#14161c; --bg-alt:#1c1f28; --bg-card:#20232d;
    --text:#f1ede3; --text-dim:#9198a8;
    --yellow:#ffc93c; --red:#e8483c; --blue:#3d8bfd; --gold:#d4af37;
    --line:#2a2e38; --green:#39c98a;
    --mono: ui-monospace, 'SF Mono', 'Courier New', monospace;
  }
  body.light{
    --bg:#f2f0ea; --bg-alt:#ffffff; --bg-card:#ffffff;
    --text:#20232b; --text-dim:#6b7280;
    --yellow:#e0a400; --red:#d6392e; --blue:#2f6fe0; --gold:#b8860b;
    --line:#e2ded3; --green:#1f9d63;
  }
  body.light .modal-bg{ background:#000000a0; }
  body.light .stripe{ opacity:1; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; padding-bottom:70px;
  }
  header{
    padding:16px 16px 14px; position:relative; overflow:hidden;
    background:linear-gradient(180deg, var(--bg-alt), var(--bg));
  }
  .headerTop{ display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  .stripe{
    height:8px; width:100%;
    background:repeating-linear-gradient(-45deg, var(--yellow) 0 14px, #0000 14px 28px, var(--red) 28px 42px, #0000 42px 56px);
    opacity:.9;
  }
  h1{
    font-size:22px; letter-spacing:.5px; text-transform:uppercase;
    font-style:italic; font-weight:800; margin-top:14px;
  }
  h1 span{color:var(--yellow);}
  h1 span.fx-red{color:var(--red);}
  .subtitle{color:var(--text-dim); font-size:12.5px; margin-top:4px;}
  .lockbtn{
    background:var(--bg-card); border:1px solid var(--line); color:var(--text-dim);
    font-size:11px; padding:7px 10px; border-radius:8px; letter-spacing:.5px;
    text-transform:uppercase; cursor:pointer; flex:0 0 auto;
  }
  .lockbtn.unlocked{color:var(--green); border-color:var(--green);}

  nav{
    display:flex; gap:6px; padding:10px 14px; overflow-x:auto;
    border-bottom:1px solid var(--line);
  }
  nav button{
    flex:0 0 auto; background:none; border:1px solid var(--line); color:var(--text-dim);
    font-size:12px; text-transform:uppercase; letter-spacing:.4px; font-weight:700;
    padding:9px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  nav button.active{background:var(--yellow); color:#14161c; border-color:var(--yellow);}

  main{padding:16px;}
  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; color:var(--yellow);}
  label{display:block; font-size:12px; color:var(--text-dim); margin:10px 0 5px;}
  input[type=text], input[type=number], input[type=password], select{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:10px 11px; border-radius:8px; font-size:14px;
  }
  input:focus, select:focus{outline:2px solid var(--blue);}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  button.primary{
    background:var(--yellow); color:#14161c; border:none; font-weight:800;
    padding:12px 16px; border-radius:9px; font-size:13px; text-transform:uppercase;
    letter-spacing:.5px; cursor:pointer; margin-top:12px;
  }
  button.secondary{
    background:none; border:1px solid var(--blue); color:var(--blue); font-weight:700;
    padding:10px 14px; border-radius:9px; font-size:12.5px; cursor:pointer; margin-top:8px;
  }
  button.danger{
    background:none; border:1px solid var(--red); color:var(--red); font-weight:700;
    padding:8px 12px; border-radius:9px; font-size:12px; cursor:pointer;
  }
  button:disabled{opacity:.4; cursor:not-allowed;}
  .playerchip{
    display:inline-flex; align-items:center; gap:6px; background:var(--bg);
    border:1px solid var(--line); border-radius:20px; padding:6px 10px; margin:3px 4px 3px 0; font-size:12.5px;
  }
  .playerchip button{background:none; border:none; color:var(--red); cursor:pointer; font-weight:900; font-size:13px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--text-dim); font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line);}
  td{padding:8px 8px; border-bottom:1px solid var(--line);}
  tr.rank1 td:first-child{color:var(--gold); font-weight:800;}
  .pts{font-family:var(--mono); font-weight:700; color:var(--yellow);}

  .manche{
    background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px;
  }
  .manche .label{font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:.3px;}
  .manche .status{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .manche .status.done{color:var(--green);}
  .manche .players{margin-top:8px; font-size:13px;}
  .posrow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-top:1px solid var(--line);}
  .posrow:first-of-type{border-top:none;}
  .posrow select{width:90px;}
  .posrow-vert{ gap:8px; }
  .posrow-vert span:first-child{ flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:38%; }
  .posBtnGroup{ display:flex; gap:4px; flex:0 0 auto; }
  .posBtn{
    width:34px; height:34px; padding:0; border-radius:7px; border:1px solid var(--line); background:var(--bg);
    color:var(--text); font-weight:800; font-size:11px; cursor:pointer;
  }
  .posBtn.active{ background:var(--yellow); color:#14161c; border-color:var(--yellow); }

  .print-only{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printView, #printView *{ visibility:visible; }
    #printView{
      display:block; position:absolute; top:0; left:0; width:100%; background:var(--bg); color:var(--text);
      padding:30px; -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
  }

  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 10px;}
  .modal-bg{
    position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:340px;}
  .searchbox{margin-bottom:12px;}
  .badge{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:800; text-transform:uppercase;}
  .badge.or{background:var(--gold); color:#14161c;}
  .badge.argent{background:#c9cdd6; color:#14161c;}
  .podium{display:flex; gap:10px; margin-top:10px;}
  .podium .place{flex:1; text-align:center; background:var(--bg); border-radius:10px; padding:14px 6px; border:1px solid var(--line);}
  .podium .place.p1{border-color:var(--gold);}
  .checklist{max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:6px;}
  .checkitem{display:flex; align-items:center; gap:8px; padding:5px 2px; font-size:13px;}
  small.hint{display:block; color:var(--text-dim); font-size:11.5px; margin-top:4px;}

  .manche.live{ border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .live-badge{
    display:inline-flex; align-items:center; gap:5px; background:var(--red); color:#fff;
    font-size:10px; font-weight:800; text-transform:uppercase; padding:2px 8px; border-radius:20px; margin-left:6px;
  }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:#fff; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .undoRedoRow{ display:flex; gap:8px; margin-top:8px; }
  .undoRedoRow button{ margin-top:0; }
  .historyItem{ font-size:12.5px; padding:6px 0; border-top:1px solid var(--line); color:var(--text-dim); }
  .historyItem:first-child{ border-top:none; }
  .historyItem b{ color:var(--text); }

  .projection-timerbar{ display:none; height:5px; background:var(--line); }
  .projection-timerbar .fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--yellow), var(--red)); }
  .projection-status{
    display:none; text-align:center; padding:11px; font-size:14px; font-weight:800;
    letter-spacing:.6px; text-transform:uppercase; color:var(--yellow);
    background:var(--bg-alt); border-bottom:1px solid var(--line);
  }
  body.projection .projection-timerbar,
  body.projection .projection-status{ display:block; }

  body.projection main{ max-width:980px; margin:0 auto; padding:30px 24px 50px; }
  body.projection header{ text-align:center; padding-bottom:8px; }
  body.projection .headerTop{ justify-content:center; }
  body.projection .lockbtn{ opacity:.4; font-size:9px; padding:5px 8px; }
  body.projection nav{ display:none; }
  body.projection h1{ font-size:38px; margin-top:10px; }
  body.projection .card{ padding:28px; border-radius:20px; box-shadow:0 10px 40px #0006; }
  body.projection .card h2{ font-size:22px; text-align:center; margin-bottom:18px; }
  body.projection .searchbox{ display:none; }
  body.projection table{ font-size:22px; }
  body.projection th{ font-size:15px; padding:10px 12px; }
  body.projection td{ padding:14px 12px; }
  body.projection tr.rank1 td{ font-size:27px; }
  body.projection .pts{ font-size:24px; }
  body.projection .manche{ padding:20px; border-radius:14px; }
  body.projection .manche .label{ font-size:19px; }
  body.projection .manche .players{ font-size:19px; margin-top:10px; }
  body.projection .manche .status{ font-size:14px; margin-top:6px; }
  body.projection .manche.live{ box-shadow:0 0 0 2px var(--red), 0 0 30px #e8483c55; }
  body.projection .live-badge{ font-size:12px; padding:4px 11px; }
  body.projection .hint{ font-size:14px; text-align:center; margin-top:14px; }
  body.projection button.secondary{ display:none; }

  .search-wrap{ position:relative; }
  .search-wrap .searchbox{ padding-right:38px; }
  .search-clear{
    display:none; position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%; background:var(--line); border:none;
    color:var(--text-dim); font-size:12px; cursor:pointer; align-items:center; justify-content:center;
  }
  .planning-group-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim);
    font-weight:800; margin:16px 0 8px;
  }
  .planning-group:first-child .planning-group-title{ margin-top:0; }
  .manche.upcoming{ border-left:3px solid var(--yellow); }
  .projection-qr-corner{
    display:none; position:fixed; bottom:18px; right:18px; background:#fff; padding:8px;
    border-radius:12px; box-shadow:0 6px 24px #0008; z-index:30;
  }
  .projection-qr-corner img{ display:block; width:100px; height:100px; }
  body.projection .projection-qr-corner{ display:block; }

  tr.followed td{ background:rgba(255,201,60,.12); }
  tr.followed td:first-child{ border-left:3px solid var(--yellow); }
  .manche.followed{ outline:2px solid var(--yellow); outline-offset:2px; }
  .followed-name{ color:var(--yellow); font-weight:800; text-shadow:0 0 8px rgba(255,201,60,.55); }
  .posrow.followed span:first-child{ color:var(--yellow); font-weight:800; }

  .follow-toast{
    position:fixed; top:14px; left:50%; transform:translate(-50%,-20px); opacity:0;
    background:var(--yellow); color:#14161c; font-weight:800; padding:12px 20px; border-radius:12px;
    box-shadow:0 8px 24px #0006; z-index:60; transition:all .3s ease; max-width:90%; text-align:center;
  }
  .follow-toast.show{ transform:translate(-50%,0); opacity:1; }
  .follow-toast-close{
    background:none; border:none; color:#14161c; font-weight:900; font-size:13px; cursor:pointer;
    margin-left:10px; pointer-events:auto; opacity:.7;
  }
  .follow-toast-close:hover{ opacity:1; }

  .emoji-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; max-height:280px; overflow-y:auto; margin-top:6px; }
  .emoji-pick{ background:var(--bg); border:1px solid var(--line); border-radius:10px; font-size:21px; padding:7px 0; cursor:pointer; }
  .emoji-pick:hover{ border-color:var(--yellow); }
  .chip-emoji{ font-size:14px; cursor:pointer; }
  .player-link{ cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  .player-link.no-results{ opacity:.5; text-decoration:none; }
</style>
</head>

// ---------- Storage (Google Sheets via Apps Script) ----------
let syncStatus = 'ok'; // 'ok' | 'error' | 'unconfigured' | 'pending'
let hasPendingLocalChanges = false;
const LOCAL_BACKUP_KEY = 'tournoi-local-backup';

function saveLocalBackup(){
  try{ localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(data)); }catch(e){}
}
function loadLocalBackup(){
  try{
    const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function loadData(){
  if(APPS_SCRIPT_URL === 'REMPLACE_MOI'){ syncStatus='unconfigured'; return; }
  return new Promise((resolve)=>{
    const cbName = 'tournoiCb_' + Date.now() + Math.floor(Math.random()*10000);
    let settled = false;
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{
      if(settled) return;
      settled = true;
      syncStatus = 'error';
      delete window[cbName];
      script.remove();
      resolve();
    }, 8000);
    window[cbName] = function(json){
      if(settled) return;
      settled = true;
      clearTimeout(timeout);
      if(json && json.config !== undefined) data = json;
      syncStatus = 'ok';
      delete window[cbName];
      script.remove();
      resolve();
    };
    script.onerror = ()=>{
      if(settled) return;
      settled = true;
      clearTimeout(timeout);
      syncStatus = 'error';
      delete window[cbName];
      resolve();
    };
    script.src = APPS_SCRIPT_URL + '?callback=' + cbName + '&_=' + Date.now();
    document.body.appendChild(script);
  });
}
async function saveData(){
  saveLocalBackup();
  if(APPS_SCRIPT_URL === 'REMPLACE_MOI'){ syncStatus='unconfigured'; updateSyncIndicator(); return; }
  try{
    await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    syncStatus = 'ok';
    hasPendingLocalChanges = false;
  }catch(e){
    console.error('Sauvegarde impossible, mise en cache locale', e);
    syncStatus = 'pending';
    hasPendingLocalChanges = true;
  }
  updateSyncIndicator();
}
function updateSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  const map = {
    ok: ['●', 'var(--green)', 'Synchronisé (visible par tous)'],
    error: ['●', 'var(--red)', 'Connexion impossible — vérifie ta connexion internet'],
    unconfigured: ['●', 'var(--yellow)', "L'URL Google Apps Script n'est pas encore configurée dans le code"],
    pending: ['●', 'var(--yellow)', 'Hors ligne — modifications gardées sur cet appareil, resynchronisation automatique au retour du réseau']
  };
  const [dot, color, title] = map[syncStatus];
  el.textContent = dot;
  el.style.color = color;
  el.title = title;
}

const EMOJI_LIST = ['😀','😎','🤩','🥳','😺','🐶','🦊','🐼','🐸','🐵','🦁','🐯','🐨','🐷','🐔','🦄','🐙','🦋','🐢','🦖','🚀','🎮','🎯','🏆','⚡','🔥','🌟','⭐','🍀','🎉','🎈','🍕','🍔','🍟','🍩','🍪','🍉','🍓','🥑','⚽','🏀','🏈','🎾','🏓','🥇','🎨','🎸','🚗','🏎️','🛹'];

// ---------- Helpers ----------
function uid(p){ return 'j'+p; }
function playerName(id){ const p = data.players.find(x=>x.id===id); return p ? p.name : '?'; }
function playerEmoji(id){ const p = data.players.find(x=>x.id===id); return p && p.emoji ? p.emoji+' ' : ''; }
function playerHasResults(id){ return data.manches.some(m=>m.phase==='qualif' && m.results[id]!==undefined); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pairKey(a,b){ return [a,b].sort().join('|'); }

function scoreRepeats(order, groupSize, used){
  let r=0;
  for(let i=0;i<order.length;i+=groupSize){
    const g=order.slice(i,i+groupSize);
    for(let x=0;x<g.length;x++) for(let y=x+1;y<g.length;y++) if(used.has(pairKey(g[x],g[y]))) r++;
  }
  return r;
}
function generateRound(ids, groupSize, used){
  let best=null, bestScore=Infinity;
  for(let a=0;a<60;a++){
    const order=shuffle(ids);
    const s=scoreRepeats(order, groupSize, used);
    if(s<bestScore){ bestScore=s; best=order; if(s===0) break; }
  }
  const groups=[];
  for(let i=0;i<best.length;i+=groupSize) groups.push(best.slice(i,i+groupSize));
  groups.forEach(g=>{ for(let x=0;x<g.length;x++) for(let y=x+1;y<g.length;y++) used.add(pairKey(g[x],g[y])); });
  return groups;
}
function generateSchedule(){
  const ids = data.players.map(p=>p.id);
  const used = new Set();
  const manches=[];
  let mid=1;
  for(let t=1; t<=data.config.tours; t++){
    const groups = generateRound(ids, data.config.groupSize, used);
    groups.forEach((g,gi)=>{
      manches.push({ id:'q'+(mid++), phase:'qualif', isFinale:false,
        label:`Tour ${t}`, players:g, results:{} });
    });
  }
  return manches;
}
function openEmojiPicker(current, onPick){
  let list = EMOJI_LIST;
  let hint = '';
  if(data.config && data.config.hideUsedEmojis){
    const used = new Set(data.players.map(p=>p.emoji).filter(Boolean));
    const filtered = EMOJI_LIST.filter(e => e===current || !used.has(e));
    if(filtered.length){ list = filtered; }
    else { hint = '<p style="font-size:11.5px; color:var(--text-dim); margin-bottom:6px;">Tous les emojis sont déjà pris — affichage de la liste complète.</p>'; }
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" id="emojiModalBg">
      <div class="modal" style="max-width:380px;">
        <h2 style="margin-bottom:6px;">Choisis un emoji</h2>
        ${hint}
        <div class="emoji-grid">
          ${list.map(e=>`<button class="emoji-pick" type="button" data-emoji="${e}">${e}</button>`).join('')}
        </div>
        <button class="secondary" id="emojiSkipBtn" style="width:100%; margin-top:12px;">Sans emoji</button>
      </div>
    </div>`;
  document.querySelectorAll('.emoji-pick').forEach(btn=>btn.onclick=()=>{
    document.getElementById('modalRoot').innerHTML='';
    onPick(btn.dataset.emoji);
  });
  document.getElementById('emojiSkipBtn').onclick = ()=>{
    document.getElementById('modalRoot').innerHTML='';
    onPick(null);
  };
  document.getElementById('emojiModalBg').onclick = (e)=>{
    if(e.target.id==='emojiModalBg'){ document.getElementById('modalRoot').innerHTML=''; onPick(current); }
  };
}
function playersChipsHtml(){
  return data.players.map(p=>`<span class="playerchip"><span class="chip-emoji" data-edit-emoji="${p.id}">${p.emoji||'➕'}</span> ${p.name} <button data-del="${p.id}">✕</button></span>`).join('')
    || '<span style="color:var(--text-dim); font-size:12.5px;">Aucun joueur pour le moment.</span>';
}
let undoStack = [];
let redoStack = [];
function snapshotPlayers(){
  undoStack.push(JSON.stringify(data.players));
  if(undoStack.length>10) undoStack.shift();
  redoStack = [];
}
async function undoPlayers(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(data.players));
  if(redoStack.length>10) redoStack.shift();
  data.players = JSON.parse(undoStack.pop());
  refreshPlayersUI();
  await saveData();
}
async function redoPlayers(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(data.players));
  if(undoStack.length>10) undoStack.shift();
  data.players = JSON.parse(redoStack.pop());
  refreshPlayersUI();
  await saveData();
}

  }
  const undoBtn = document.getElementById('undoPlayersBtn');
  if(undoBtn) undoBtn.disabled = undoStack.length===0;
  const redoBtn = document.getElementById('redoPlayersBtn');
  if(redoBtn) redoBtn.disabled = redoStack.length===0;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick = async ()=>{
    snapshotPlayers();
    data.players = data.players.filter(p=>p.id!==b.dataset.del);
    refreshPlayersUI();
    await saveData();
  });
  document.querySelectorAll('[data-edit-emoji]').forEach(el=>el.onclick = ()=>{
    const pid = el.dataset.editEmoji;
    const p = data.players.find(x=>x.id===pid);
    if(!p) return;
    openEmojiPicker(p.emoji, async (emoji)=>{
      p.emoji = emoji;
      refreshPlayersUI();
      await saveData();
    });
  });
}
function pointsFor(position){
  const t = data.config.pointsTable;
  return t[position-1] !== undefined ? t[position-1] : 0;
}
function classementGeneral(){
  const totals={};
  data.players.forEach(p=>totals[p.id]=0);
  data.manches.filter(m=>m.phase==='qualif').forEach(m=>{
    Object.entries(m.results).forEach(([pid,pos])=>{ totals[pid] = (totals[pid]||0) + pointsFor(pos); });
  });
  return data.players.map(p=>({id:p.id, name:p.name, pts:totals[p.id]||0}))
    .sort((a,b)=>b.pts-a.pts);
}
function mancheComplete(m){
  return m.players.every(pid => m.results[pid] !== undefined);
}
function wireSearchBox(inputId, onInput){
  const input = document.getElementById(inputId);
  if(!input) return;
  const clearBtn = input.parentElement.querySelector('.search-clear');
  const sync = ()=>{ if(clearBtn) clearBtn.style.display = input.value ? 'flex' : 'none'; };
  input.oninput = (e)=>{ onInput(e.target.value); sync(); };
  if(clearBtn) clearBtn.onclick = ()=>{ input.value=''; onInput(''); sync(); input.focus(); };
  sync();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function generateResultsImage(){
  const rows = classementGeneral();
  const podium = getPodiumManche();
  const width = 800;
  const rowH = 34;
  const headerH = podium ? 250 : 130;
  const height = headerH + rows.length*rowH + 50;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#14161c';
  ctx.fillRect(0,0,width,height);

  // bande diagonale décorative
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,width,8); ctx.clip();
  for(let x=-40; x<width+40; x+=28){
    ctx.fillStyle = (Math.floor(x/28)%2===0) ? '#ffc93c' : '#e8483c';
    ctx.beginPath();
    ctx.moveTo(x,0); ctx.lineTo(x+14,0); ctx.lineTo(x+14-8,8); ctx.lineTo(x-8,8);
    ctx.fill();
  }
  ctx.restore();

  // titre
  ctx.textAlign = 'left';
  ctx.font = 'italic 900 30px sans-serif';
  ctx.fillStyle = '#e8483c';
  ctx.fillText('TOURNOI', 30, 55);
  const w1 = ctx.measureText('TOURNOI ').width;
  ctx.fillStyle = '#ffc93c';
  ctx.fillText('MARIO KART', 30+w1, 55);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#9198a8';
  ctx.fillText('AS Joliot-Curie — Résultats finaux', 30, 78);

  let y = 100;

  if(podium){
    const ranked = Object.entries(podium.results).sort((a,b)=>a[1]-b[1]).slice(0,3);
    const medals = ['🥇','🥈','🥉'];
    const gap = 16;
    const boxW = (width-60-2*gap)/3;
    ranked.forEach(([pid,pos],i)=>{
      const x = 30 + i*(boxW+gap);
      ctx.fillStyle = '#20232d';
      ctx.strokeStyle = i===0 ? '#d4af37' : '#2a2e38';
      ctx.lineWidth = 2;
      roundRect(ctx, x, y, boxW, 110, 10);
      ctx.fill(); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.font = '34px sans-serif';
      ctx.fillStyle = '#f1ede3';
      ctx.fillText(medals[i], x+boxW/2, y+48);
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(playerEmoji(pid)+playerName(pid), x+boxW/2, y+80);
    });
    ctx.textAlign = 'left';
    y += 140;
  }

  ctx.fillStyle = '#ffc93c';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('CLASSEMENT GÉNÉRAL', 30, y);
  y += 14;
  ctx.strokeStyle = '#2a2e38';
  ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(width-30,y); ctx.stroke();
  y += 24;

  rows.forEach((r,i)=>{
    ctx.textAlign = 'left';
    ctx.fillStyle = i===0 ? '#d4af37' : '#f1ede3';
    ctx.font = i===0 ? 'bold 16px sans-serif' : '15px sans-serif';
    ctx.fillText(`${i+1}.  ${playerEmoji(r.id)}${r.name}`, 30, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffc93c';
    ctx.font = 'bold 15px monospace';
    ctx.fillText(`${r.pts} pts`, width-30, y);
    y += rowH;
    if(i<rows.length-1){
      ctx.strokeStyle = '#2a2e38';
      ctx.beginPath(); ctx.moveTo(30,y-rowH+22); ctx.lineTo(width-30,y-rowH+22); ctx.stroke();
    }
  });

  return canvas;
}
function qualifsComplete(){
  const qm = data.manches.filter(m=>m.phase==='qualif');
  return qm.length>0 && qm.every(mancheComplete);
}
function getPodiumManche(){
  const fm = data.manches.filter(m=>m.phase!=='qualif');
  return [...fm].reverse().find(m=>m.isFinale && mancheComplete(m));
}
function tournamentFinished(){
  return !!getPodiumManche();
}
function formatDuration(ms){
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const min = totalMin%60;
  return h>0 ? `${h}h${String(min).padStart(2,'0')}` : `${min} min`;
}
function computeMostConsistent(){
  const stats = {};
  data.players.forEach(p=>stats[p.id]=[]);
  data.manches.filter(m=>m.phase==='qualif').forEach(m=>{
    Object.entries(m.results).forEach(([pid,pos])=>{ if(stats[pid]) stats[pid].push(pos); });
  });
  let best=null, bestStd=Infinity;
  Object.entries(stats).forEach(([pid,positions])=>{
    if(positions.length<2) return;
    const avg = positions.reduce((a,b)=>a+b,0)/positions.length;
    const variance = positions.reduce((a,b)=>a+(b-avg)**2,0)/positions.length;
    const std = Math.sqrt(variance);
    if(std<bestStd){ bestStd=std; best={pid, std}; }
  });
  return best;
}

function mancheCardHtml(m, extraClass){

        <div class="label">${m.label} ${m.live?'<span class="live-badge"><span class="live-dot"></span>En direct</span>':''}</div>
        <div class="status ${mancheComplete(m)?'done':''}">${mancheComplete(m)?'✓ Résultats enregistrés':(m.live?'🔴 En cours — c\'est maintenant !':'À venir')}</div>
        <div class="players">${m.players.map(pid=>{

function mancheResultCardHtml(m){

          }).join(' · ')}

function planningResultsHtml(){
  const qm = data.manches.filter(m=>m.phase==='qualif');
  const matches = (m)=> !searchName.trim() || m.players.some(pid=>playerName(pid).toLowerCase().includes(searchName.toLowerCase()));

  const liveList = qm.filter(m=>m.live);
  const notLive = qm.filter(m=>!m.live);
  const completedList = notLive.filter(mancheComplete);
  const pendingNotLive = notLive.filter(m=>!mancheComplete(m));
  const upcoming = pendingNotLive.slice(0,2);
  const upcomingIds = new Set(upcoming.map(m=>m.id));
  const restList = pendingNotLive.filter(m=>!upcomingIds.has(m.id));

  function renderGroup(title, list, extraClass){
    const filtered = list.filter(matches);
    if(!filtered.length) return '';
    return `<div class="planning-group">
      <div class="planning-group-title">${title}</div>
      ${filtered.map(m=>mancheCardHtml(m, extraClass)).join('')}
    </div>`;
  }
  function renderArchived(list){
    const filtered = list.filter(matches);
    if(!filtered.length) return '';
    return `<details id="planningArchiveDetails" style="margin-top:16px;" ${planningArchiveOpen?'open':''}>
      <summary style="cursor:pointer; color:var(--text-dim); font-size:12px; text-transform:uppercase; letter-spacing:.5px; font-weight:800; padding:8px 0;">📦 ${filtered.length} course(s) terminée(s) — voir les résultats</summary>
      ${filtered.map(m=>mancheResultCardHtml(m)).join('')}
    </details>`;
  }
  const html = renderGroup('🔴 En direct', liveList)
    + renderGroup('⏭️ À venir bientôt', upcoming, 'upcoming')
    + renderGroup('📋 Toutes les manches', restList)
    + renderArchived(completedList);
  return html || `<div class="empty">Aucun résultat pour ce joueur.</div>`;
}
function viewPlanning(){

// ---------- Vue Scores (admin) ----------
function scoresResultsHtml(){
  const match = (m)=> !searchScores.trim() || m.players.some(pid=>playerName(pid).toLowerCase().includes(searchScores.toLowerCase()));
  const qualif = data.manches.filter(m=>m.phase==='qualif' && match(m));
  const finales = data.manches.filter(m=>m.phase!=='qualif' && match(m));
  const qualifTodo = qualif.filter(m=>!mancheComplete(m));
  const qualifDone = qualif.filter(mancheComplete);
  return `<div class="card">
    <h2>Saisie des scores — Qualifications</h2>
    ${qualifTodo.map(m=>renderMancheEditor(m)).join('') || '<div class="empty">Toutes les manches ont un résultat 🎉</div>'}
    ${qualifDone.length ? `<details id="scoresArchiveDetails" style="margin-top:14px;" ${scoresArchiveOpen?'open':''}>
      <summary style="cursor:pointer; color:var(--text-dim); font-size:12.5px; padding:8px 0;">📦 ${qualifDone.length} manche(s) archivée(s) (terminée) — cliquer pour afficher</summary>
      ${qualifDone.map(m=>renderMancheEditor(m)).join('')}
    </details>` : ''}
  </div>
  <div class="card">
    <h2>Manches finales</h2>
    ${finales.map(m=>renderMancheEditor(m)).join('') || '<p style="font-size:12.5px; color:var(--text-dim);">Aucune manche finale.</p>'}
    ${qualifsComplete() ? renderNewFinaleForm() : '<p style="font-size:12px; color:var(--text-dim); margin-top:10px;">Termine les qualifications pour créer les manches finales.</p>'}
  </div>`;
}
function viewScores(){
  if(!data.manches.length) return `<div class="card"><div class="empty">Aucune manche à noter. Génère-les d'abord dans Réglages.</div></div>`;
  return `<div class="card">
    <div class="row" style="align-items:center;">
      <div id="scoresElapsedTimer" style="font-size:12.5px; color:var(--text-dim); font-weight:700;">⏱️ …</div>
      <button type="button" class="secondary" id="timerEditBtn" style="margin-top:0; flex:0 0 auto; padding:6px 10px; font-size:11px;">✏️ Modifier</button>
      <button type="button" class="secondary" id="timerResetBtn" style="margin-top:0; flex:0 0 auto; padding:6px 10px; font-size:11px;">🔄 Réinitialiser</button>
    </div>
    <div class="search-wrap">
      <input class="searchbox" type="text" id="searchScoresInput" placeholder="Rechercher un joueur ou un groupe…" value="${searchScores}">
      <button class="search-clear" type="button">✕</button>
    </div>
    <button class="danger" id="clearAllLiveBtn" style="margin-top:0;">Tout marquer non-live</button>
    <button class="secondary" id="exportAllManchesBtn" style="margin-top:0; margin-left:8px;">📥 Export complet (CSV)</button>
  </div>
  <div id="scoresResults">${scoresResultsHtml()}</div>
  <div class="card">
    <h2>Dernières modifications</h2>
    ${(data.actionLog||[]).length ? data.actionLog.map(a=>`<div class="historyItem"><b>${a.time}</b> — Résultats enregistrés pour <b>${a.label}</b></div>`).join('') : '<p style="font-size:12.5px; color:var(--text-dim);">Aucune modification pour le moment.</p>'}
  </div>`;
}

function renderMancheEditor(m){
  const positions = Array.from({length:m.players.length}, (_,i)=>i+1);
  const hasFollowed = m.players.includes(followedPlayerId);
  return `<div class="manche ${m.live?'live':''} ${hasFollowed?'followed':''}">
    <div class="label">${m.label} ${m.isFinale ? '<span class="badge or">Finale</span>' : ''} ${m.live?'<span class="live-badge"><span class="live-dot"></span>En direct</span>':''}</div>
    ${m.players.map(pid=>`
      <div class="posrow posrow-vert ${pid===followedPlayerId?'followed':''}">
        <span>${pid===followedPlayerId?'👁️ ':''}${playerEmoji(pid)}${playerName(pid)}</span>
        <div class="posBtnGroup" data-manche="${m.id}" data-player="${pid}">
          ${positions.map(p=>`<button type="button" class="posBtn ${m.results[pid]===p?'active':''}" data-pos="${p}">${p}${p===1?'er':'e'}</button>`).join('')}
        </div>
      </div>`).join('')}
    <button class="secondary saveMancheBtn" data-manche="${m.id}">Enregistrer les résultats</button>
    ${mancheComplete(m) ? '' : `<button class="secondary toggleLiveBtn" data-manche="${m.id}" style="margin-left:8px; ${m.live?'border-color:var(--red); color:var(--red);':''}">${m.live?'Retirer "en direct"':'🔴 Marquer en direct'}</button>`}
    <button class="danger delMancheBtn" data-manche="${m.id}" style="margin-left:8px;">Supprimer</button>
  </div>`;
}

function renderNewFinaleForm(){
  const ranked = classementGeneral();
  return `<div class="manche" style="border-style:dashed;">
    <div class="label">Créer une manche finale</div>
    <label>Nom de la manche</label>
    <input type="text" id="finaleLabel" placeholder="ex : Or — Finale">
    <label>Phase</label>
    <select id="finalePhase"><option value="or">Tableau Mario</option><option value="argent">Tableau Luigi</option></select>
    <label><input type="checkbox" id="finaleIsPodium" style="width:auto; display:inline-block;"> Marquer comme manche décisive (affiche le podium)</label>
    <label>Joueurs concernés</label>
    <div class="checklist">
      ${ranked.map(r=>`<div class="checkitem"><input type="checkbox" class="finalePlayer" value="${r.id}" style="width:auto;"> ${playerEmoji(r.id)}${r.name} <span style="color:var(--text-dim); font-size:11px;">(${r.pts}pts)</span></div>`).join('')}
    </div>

// ---------- Handlers ----------
let scoresTimerInterval = null;
function updateScoresTimer(){
  const el = document.getElementById('scoresElapsedTimer');
  if(!el) return;
  el.textContent = data.startedAt
    ? `⏱️ ${formatDuration(Date.now() - data.startedAt)} depuis le début`
    : '⏱️ Le tournoi n\'a pas encore démarré';
}
function attachHandlers(){
  const timerResetBtn = document.getElementById('timerResetBtn');
  if(timerResetBtn) timerResetBtn.onclick = async ()=>{
    if(!confirm('Redémarrer le chrono à maintenant ?')) return;
    data.startedAt = Date.now();
    updateScoresTimer();
    await saveData();
  };
  const timerEditBtn = document.getElementById('timerEditBtn');
  if(timerEditBtn) timerEditBtn.onclick = async ()=>{
    const current = data.startedAt ? new Date(data.startedAt) : new Date();
    const pad = n=>String(n).padStart(2,'0');
    const defaultVal = `${pad(current.getHours())}:${pad(current.getMinutes())}`;
    const input = prompt("Heure de début du tournoi (aujourd'hui), format HH:MM :", defaultVal);
    if(!input) return;
    const match = input.trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!match){ alert('Format invalide. Utilise HH:MM, ex : 18:30'); return; }
    const d = data.startedAt ? new Date(data.startedAt) : new Date();
    d.setHours(parseInt(match[1]), parseInt(match[2]), 0, 0);
    data.startedAt = d.getTime();
    updateScoresTimer();
    await saveData();
  };
  const myResultsBtn = document.getElementById('myResultsBtn');
  if(myResultsBtn) myResultsBtn.onclick = ()=>{
    selectedBilanPlayerId = followedPlayerId;
    searchBilan = '';
    const wrap = document.getElementById('bilanPlayerResult');
    if(wrap){ wrap.innerHTML = bilanPlayerHtml(); wireBilanPlayerPicks(); }
  };
  bindArchiveToggle('planningArchiveDetails', (open)=>{ planningArchiveOpen = open; });
  bindArchiveToggle('scoresArchiveDetails', (open)=>{ scoresArchiveOpen = open; });
  if(currentTab==='scores'){
    updateScoresTimer();
    if(!scoresTimerInterval) scoresTimerInterval = setInterval(updateScoresTimer, 15000);
  } else if(scoresTimerInterval){
    clearInterval(scoresTimerInterval);
    scoresTimerInterval = null;
  }
  const printBtn = document.getElementById('printBtn');
  if(printBtn) printBtn.onclick = ()=>{
    const rows = classementGeneral();
    const podium = getPodiumManche();
    document.getElementById('printView').innerHTML = `
      <div style="text-align:center; margin-bottom:24px;">
        <h1 style="font-size:28px; font-style:italic; font-weight:800; text-transform:uppercase;">
          <span style="color:var(--red);">Tournoi</span> <span style="color:var(--yellow);">Mario Kart</span>
        </h1>
        <div style="color:var(--text-dim); font-size:13px; margin-top:4px;">AS Joliot-Curie — Résultats du tournoi</div>
      </div>
      ${podium ? `<div class="card"><h2>🏆 Podium final — ${podium.label}</h2>
        <div class="podium">
          ${Object.entries(podium.results).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([pid,pos],i)=>`
            <div class="place p${i+1}">
              <div style="font-size:22px;">${i===0?'🥇':i===1?'🥈':'🥉'}</div>
              <div style="font-weight:700; font-size:13px; margin-top:4px;">${playerEmoji(pid)}${playerName(pid)}</div>
            </div>`).join('')}
        </div>
      </div>` : ''}
      <div class="card">
        <h2>Classement général — Qualifications</h2>
        <table><thead><tr><th>#</th><th>Joueur</th><th>Points</th></tr></thead><tbody>
          ${rows.map((r,i)=>`<tr class="${i===0?'rank1':''}"><td>${i+1}</td><td>${playerEmoji(r.id)}${r.name}</td><td class="pts">${r.pts}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div style="text-align:center; color:var(--text-dim); font-size:11px; margin-top:20px;">Généré le ${new Date().toLocaleDateString('fr-FR')}</div>
    `;
    window.print();
  };

  const exportImg = document.getElementById('exportImgBtn');
  if(exportImg) exportImg.onclick = ()=>{
    const canvas = generateResultsImage();
    const a = document.createElement('a');
    a.download = 'classement-mario-kart.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  const exportCsv = document.getElementById('exportCsvBtn');
  if(exportCsv) exportCsv.onclick = ()=>{
    const rows = classementGeneral();
    let csv = 'Classement général\nRang,Joueur,Points\n';
    rows.forEach((r,i)=>{ csv += `${i+1},"${r.name}",${r.pts}\n`; });
    const podium = getPodiumManche();
    if(podium){
      csv += '\nPodium final\nPlace,Joueur\n';
      const ranked = Object.entries(podium.results).sort((a,b)=>a[1]-b[1]);
      ranked.forEach(([pid,pos])=>{ csv += `${pos},"${playerName(pid)}"\n`; });
    }
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'classement-mario-kart.csv';
    a.click();
  };

  wireSearchBox('searchInput', (val)=>{
    searchName = val;
    const wrap = document.getElementById('planningResults');
    if(wrap) wrap.innerHTML = planningResultsHtml();
    bindArchiveToggle('planningArchiveDetails', (open)=>{ planningArchiveOpen = open; });
  });

  wireSearchBox('searchClassementInput', (val)=>{
    searchClassement = val;
    const wrap = document.getElementById('classementResults');
    if(wrap) wrap.innerHTML = classementRowsHtml();
  });

  const cfgPinToggle = document.getElementById('cfgPinToggle');
  if(cfgPinToggle) cfgPinToggle.onclick = ()=>{
    const pinInput = document.getElementById('cfgPin');
    const showing = pinInput.type === 'text';
    pinInput.type = showing ? 'password' : 'text';
    cfgPinToggle.textContent = showing ? '👁️' : '🙈';
  };

  const cfgOrToggle = document.getElementById('cfgOrToggle');
  if(cfgOrToggle) cfgOrToggle.onclick = ()=>{
    const hidden = document.getElementById('cfgOrAuto');
    const input = document.getElementById('cfgOr');
    const nowAuto = hidden.value !== 'true';
    hidden.value = nowAuto;
    input.disabled = nowAuto;
    if(nowAuto) input.value = Math.ceil((data.players.length||0)/2) || 1;
    cfgOrToggle.textContent = nowAuto ? '✏️ Modifier' : '🔄 Auto';
  };

  const cfgHideUsedEmojis = document.getElementById('cfgHideUsedEmojis');
  if(cfgHideUsedEmojis) cfgHideUsedEmojis.onchange = async ()=>{
    if(!data.config){
      alert("Enregistre d'abord la configuration (code admin) avant d'activer cette option.");
      cfgHideUsedEmojis.checked = false;
      return;
    }
    data.config.hideUsedEmojis = cfgHideUsedEmojis.checked;
    await saveData();
  };

  const saveCfg = document.getElementById('saveCfgBtn');
  if(saveCfg) saveCfg.onclick = async ()=>{
    const pin = document.getElementById('cfgPin').value.trim();
    if(!pin){ alert('Merci de définir un code admin.'); return; }
    const qualifiedOrAuto = document.getElementById('cfgOrAuto').value === 'true';
    data.config = {
      pin,
      groupSize: parseInt(document.getElementById('cfgGroupSize').value)||4,
      tours: parseInt(document.getElementById('cfgTours').value)||3,
      pointsTable: document.getElementById('cfgPoints').value.split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)),
      qualifiedOr: qualifiedOrAuto ? (Math.ceil((data.players.length||0)/2)||1) : (parseInt(document.getElementById('cfgOr').value)||1),
      qualifiedOrAuto,
      hideUsedEmojis: document.getElementById('cfgHideUsedEmojis')?.checked || false
    };
    await saveData();
    render();
  };

  const addP = document.getElementById('addPlayerBtn');
  if(addP) addP.onclick = ()=>{
    const inp = document.getElementById('newPlayerName');
    const name = inp.value.trim();
    if(!name) return;
    openEmojiPicker(null, async (emoji)=>{
      snapshotPlayers();
      data.players.push({ id: 'j'+Date.now()+Math.floor(Math.random()*1000), name, emoji });
      inp.value='';
      refreshPlayersUI();
      await saveData();
    });
  };

  const bulkAdd = document.getElementById('bulkAddBtn');
  if(bulkAdd) bulkAdd.onclick = async ()=>{
    const ta = document.getElementById('bulkPlayers');
    const names = ta.value.split('\n').map(n=>n.trim()).filter(Boolean);
    if(!names.length) return;
    snapshotPlayers();
    names.forEach(name=>data.players.push({ id:'j'+Date.now()+Math.floor(Math.random()*10000), name, emoji: EMOJI_LIST[Math.floor(Math.random()*EMOJI_LIST.length)] }));
    ta.value='';
    refreshPlayersUI();
    await saveData();
  };

  const undoBtn = document.getElementById('undoPlayersBtn');
  if(undoBtn) undoBtn.onclick = undoPlayers;
  const redoBtn = document.getElementById('redoPlayersBtn');
  if(redoBtn) redoBtn.onclick = redoPlayers;

  const deleteAllPlayersBtn = document.getElementById('deleteAllPlayersBtn');
  if(deleteAllPlayersBtn) deleteAllPlayersBtn.onclick = async ()=>{
    if(!data.players.length) return;
    if(!confirm(`Supprimer les ${data.players.length} joueurs de la liste ? (annulable avec "Annuler")`)) return;
    snapshotPlayers();
    data.players = [];
    refreshPlayersUI();
    await saveData();
  };

  const fullResetBtn = document.getElementById('fullResetBtn');
  if(fullResetBtn) fullResetBtn.onclick = async ()=>{
    const typed = prompt('Cette action efface DÉFINITIVEMENT tout le tournoi (joueurs, manches, scores, configuration).\nTape SUPPRIMER en majuscules pour confirmer :');
    if(typed !== 'SUPPRIMER') return;
    data = { config:null, players:[], manches:[], status:'setup' };
    unlocked = false;
    followedPlayerId = null;
    try{ localStorage.removeItem('followedPlayerId'); }catch(e){}
    currentTab = 'classement';
    await saveData();
    updateLockBtn();
    render();
    alert('Le tournoi a été réinitialisé.');
  };

  refreshPlayersUI();

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = async ()=>{
    const text = JSON.stringify(data);
    try{
      await navigator.clipboard.writeText(text);
      alert('Données copiées ! Colle-les sur l\'autre appareil via "Coller des données".');
    }catch(e){
      prompt('Copie ce texte manuellement :', text);
    }
  };
  const importBtn = document.getElementById('importBtn');
  if(importBtn) importBtn.onclick = async ()=>{
    const text = prompt('Colle ici les données copiées depuis l\'autre appareil :');
    if(!text) return;
    try{
      const parsed = JSON.parse(text);
      data = parsed;
      await saveData();
      render();
      alert('Données importées !');
    }catch(e){
      alert('Le texte collé n\'est pas valide.');
    }
  };

  const genBtn = document.getElementById('genBtn');
  if(genBtn) genBtn.onclick = async ()=>{
    if(data.manches.some(m=>m.phase==='qualif') && !confirm('Régénérer effacera les manches et scores actuels. Continuer ?')) return;
    const finales = data.manches.filter(m=>m.phase!=='qualif');
    data.manches = [...generateSchedule(), ...finales];
    data.status = 'qualif';
    if(!data.startedAt) data.startedAt = Date.now();
    await saveData();
    alert('Manches générées !');
    render();
  };

  bindScoreEditors();

  const clearAllLive = document.getElementById('clearAllLiveBtn');
  if(clearAllLive) clearAllLive.onclick = async ()=>{
    data.manches.forEach(m=>{ m.live = false; });
    await saveData();
    renderContent();
  };

  const exportAll = document.getElementById('exportAllManchesBtn');
  if(exportAll) exportAll.onclick = ()=>{
    let csv = 'Manche,Phase,En direct,Joueur,Position,Points\n';
    data.manches.forEach(m=>{
      m.players.forEach(pid=>{
        const pos = m.results[pid];
        const pts = (m.phase==='qualif' && pos) ? pointsFor(pos) : '';
        csv += `"${m.label}",${m.phase},${m.live?'oui':'non'},"${playerName(pid)}",${pos||''},${pts}\n`;
      });
    });
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'toutes-les-manches-mario-kart.csv';
    a.click();
  };

  const searchScoresBox = document.getElementById('searchScoresInput');
  if(searchScoresBox) wireSearchBox('searchScoresInput', (val)=>{
    searchScores = val;
    const wrap = document.getElementById('scoresResults');
    if(wrap){ wrap.innerHTML = scoresResultsHtml(); bindScoreEditors(); }
  });

  const searchBilanBox = document.getElementById('searchBilanInput');
  if(searchBilanBox){
    wireSearchBox('searchBilanInput', (val)=>{
      searchBilan = val;
      selectedBilanPlayerId = null;
      const wrap = document.getElementById('bilanPlayerResult');
      if(wrap){ wrap.innerHTML = bilanPlayerHtml(); wireBilanPlayerPicks(); }
    });
    wireBilanPlayerPicks();
  }
}

function bindScoreEditors(){
  bindArchiveToggle('scoresArchiveDetails', (open)=>{ scoresArchiveOpen = open; });
  document.querySelectorAll('.posBtn').forEach(btn=>{
    btn.onclick = ()=>{
      const group = btn.parentElement;
      const mid = group.dataset.manche;
      const pos = btn.dataset.pos;
      const wasActive = btn.classList.contains('active');
      document.querySelectorAll(`.posBtnGroup[data-manche="${mid}"]`).forEach(g=>{
        g.querySelectorAll('.posBtn').forEach(b=>{ if(b.dataset.pos===pos) b.classList.remove('active'); });
      });
      group.querySelectorAll('.posBtn').forEach(b=>b.classList.remove('active'));
      if(!wasActive) btn.classList.add('active');
    };
  });

  document.querySelectorAll('.saveMancheBtn').forEach(b=>b.onclick = async ()=>{
    if(b.disabled) return;
    b.disabled = true;
    const originalText = b.textContent;
    b.textContent = 'Enregistrement…';
    const mid = b.dataset.manche;
    const m = data.manches.find(x=>x.id===mid);
    const groups = document.querySelectorAll(`.posBtnGroup[data-manche="${mid}"]`);
    groups.forEach(g=>{
      const activeBtn = g.querySelector('.posBtn.active');
      const pid = g.dataset.player;
      if(activeBtn) m.results[pid] = parseInt(activeBtn.dataset.pos);
      else delete m.results[pid];
    });
    if(!data.actionLog) data.actionLog = [];
    data.actionLog.unshift({ label: m.label, time: new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) });
    data.actionLog = data.actionLog.slice(0,5);
    if(m.isFinale && mancheComplete(m) && !data.finishedAt) data.finishedAt = Date.now();
    if(m.live && mancheComplete(m)) m.live = false;
    await saveData();
    renderContent();
  });

  document.querySelectorAll('.toggleLiveBtn').forEach(b=>b.onclick = async ()=>{
    const m = data.manches.find(x=>x.id===b.dataset.manche);
    m.live = !m.live;
    checkFollowedLiveAlert();
    renderContent();
    await saveData();
  });

  document.querySelectorAll('.delMancheBtn').forEach(b=>b.onclick = async ()=>{
    if(!confirm('Supprimer cette manche ?')) return;
    data.manches = data.manches.filter(m=>m.id!==b.dataset.manche);
    await saveData();
    renderContent();
  });

  const createFinale = document.getElementById('createFinaleBtn');
  if(createFinale) createFinale.onclick = async ()=>{
    if(!qualifsComplete()){
      alert('Toutes les manches de qualification doivent avoir un résultat avant de créer une manche finale.');
      return;
    }
    const label = document.getElementById('finaleLabel').value.trim();
    const phase = document.getElementById('finalePhase').value;
    const isFinale = document.getElementById('finaleIsPodium').checked;
    const players = Array.from(document.querySelectorAll('.finalePlayer:checked')).map(c=>c.value);
    if(!label || players.length<2){ alert('Ajoute un nom et au moins 2 joueurs.'); return; }
    data.manches.push({ id:'f'+Date.now(), phase, isFinale, label, players, results:{} });
    await saveData();
    renderContent();
  };
}

let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function playAlertSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime+0.15);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    o.start();
    o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}
function showFollowToast(text){
  const el = document.createElement('div');
  el.className = 'follow-toast';
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.className = 'follow-toast-close';
  const dismiss = ()=>{ clearTimeout(autoTimer); el.classList.remove('show'); setTimeout(()=>el.remove(),400); };
  closeBtn.onclick = dismiss;
  el.textContent = text;
  el.appendChild(closeBtn);
  document.body.appendChild(el);
  setTimeout(()=>el.classList.add('show'), 10);
  const autoTimer = setTimeout(dismiss, 9000);
}
let lastKnownLiveIds = new Set();
function resetLiveBaseline(){
  lastKnownLiveIds = new Set(data.manches.filter(m=>m.live).map(m=>m.id));
}
function checkFollowedLiveAlert(){
  if(!followedPlayerId){ resetLiveBaseline(); return; }
  const newlyLive = data.manches.filter(m=>m.live && m.players.includes(followedPlayerId) && !lastKnownLiveIds.has(m.id));
  if(newlyLive.length){
    try{ navigator.vibrate?.([200,80,200]); }catch(e){}
    playAlertSound();
    showFollowToast(`🔴 C'est parti pour ${playerName(followedPlayerId)} — ${newlyLive[0].label} !`);
  }
  resetLiveBaseline();
}

      <div class="modal-bg" id="statsModalBg">

        </div>
      </div>`;

  const avgPos = positions.length ? (positions.reduce((a,b)=>a+b,0)/positions.length).toFixed(1) : null;

    <div class="modal-bg" id="statsModalBg">

        <table><tbody>
          <tr><td>Rang qualifs</td><td class="pts" style="text-align:right;">${rank>0?rank:'—'} / ${rows.length}</td></tr>
          <tr><td>Points totaux</td><td class="pts" style="text-align:right;">${total}</td></tr>
          <tr><td>Courses jouées</td><td class="pts" style="text-align:right;">${qualifManches.length}</td></tr>

        <div class="planning-group-title" style="margin-top:16px;">Historique des courses</div>
        ${qualifManches.length ? qualifManches.map(m=>`<div class="historyItem">${m.label} — ${m.results[p.id]}${m.results[p.id]===1?'er':'e'} place (+${pointsFor(m.results[p.id])} pts)</div>`).join('') : '<p style="font-size:12.5px; color:var(--text-dim);">Aucune course jouée pour le moment.</p>'}
        ${finaleManches.length ? `<div class="planning-group-title" style="margin-top:16px;">Phases finales</div>${finaleManches.map(m=>`<div class="historyItem">${m.label} — ${m.results[p.id]}${m.results[p.id]===1?'er':'e'} place</div>`).join('')}` : ''}

      </div>

// ---------- Mode projection ----------
let projectionMode = false;
let projectionTickInterval = null;
let projectionElapsed = 0;
const PROJECTION_DURATION = 10000;

function tabLabel(tab){
  return tab==='classement' ? '🏆 Classement' : '🗓️ Planning';
}
function updateProjectionTimerUI(){
  const fill = document.getElementById('projectionTimerFill');
  const label = document.getElementById('projectionStatusLabel');
  if(fill) fill.style.width = Math.min(100, (projectionElapsed/PROJECTION_DURATION)*100) + '%';
  if(label){
    const remaining = Math.max(0, Math.ceil((PROJECTION_DURATION-projectionElapsed)/1000));
    const nextTab = currentTab==='classement' ? 'Planning' : 'Classement';
    label.textContent = `${tabLabel(currentTab)}  ·  ${nextTab} dans ${remaining}s`;
  }
}
function startProjectionTicker(){
  clearInterval(projectionTickInterval);
  projectionElapsed = 0;
  updateProjectionTimerUI();
  projectionTickInterval = setInterval(()=>{
    projectionElapsed += 200;
    if(projectionElapsed >= PROJECTION_DURATION){
      projectionElapsed = 0;
      currentTab = currentTab==='classement' ? 'planning' : 'classement';
      render();
    }
    updateProjectionTimerUI();
  }, 200);
}
document.getElementById('projectionBtn').onclick = ()=>{
  projectionMode = !projectionMode;
  document.body.classList.toggle('projection', projectionMode);
  const btn = document.getElementById('projectionBtn');
  if(projectionMode){
    btn.textContent = '✕';
    document.documentElement.requestFullscreen?.().catch(()=>{});
    currentTab = 'classement';
    render();
    startProjectionTicker();
  } else {
    btn.textContent = '📽️';
    if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
    clearInterval(projectionTickInterval);
  }
};
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && projectionMode){
    projectionMode = false;
    document.body.classList.remove('projection');
    document.getElementById('projectionBtn').textContent = '📽️';
    clearInterval(projectionTickInterval);
  }
});

// ---------- Init & polling ----------
async function init(){
  await loadData();
  if(syncStatus==='error'){
    const backup = loadLocalBackup();
    if(backup){ data = backup; hasPendingLocalChanges = true; syncStatus = 'pending'; }
  }
  const params = new URLSearchParams(location.search);
  const joueurParam = params.get('joueur');
  if(joueurParam && data.players.some(p=>p.id===joueurParam)){
    selectedBilanPlayerId = joueurParam;
    currentTab = 'bilan';
  }
  resetLiveBaseline();
  render();
  updateSyncIndicator();
  updateFollowBtn();
  async function pollTick(){
    if(!unlocked && !document.hidden){
      if(hasPendingLocalChanges){
        await saveData();
      } else {
        await loadData();
      }
      checkFollowedLiveAlert();
      render();
      updateSyncIndicator();
    }
  }
  setInterval(pollTick, 4000);
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) pollTick();
  });
}
document.body.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-stats-player]');
  if(el) showPlayerStatsModal(el.dataset.statsPlayer);
});

window.addEventListener('beforeunload', (e)=>{
  if(unlocked && hasPendingLocalChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

init();
</script>
